<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23faf9f7'/%3E%3Cpath d='M6 17v-3m4 7V10m4 13V8m4 15V11m4 12V14m4 9v-6' fill='none' stroke='%238e2433' stroke-linecap='round' stroke-width='1.8'/%3E%3C/svg%3E" />
    <title>Truy cập · ASR EN VI</title>
    <script src="/assets/i18n.js"></script>
    <script src="/assets/theme.js"></script>
    <link rel="stylesheet" href="/assets/design-system.css" />
    <link rel="stylesheet" href="/assets/access.css" />
    <script type="module" src="/assets/access.js"></script>
  </head>
  <body>
    <!--
      THESIS: Local access reads like the cover of an engineering logbook, not a generic sign-in card.
      OWN-WORLD: Warm paper or charcoal fields, burgundy signal lines, fine hairlines, Newsreader headings, Inter controls, and JetBrains Mono metadata.
      STORY: The operator understands where the token comes from, opens the private workspace, and sees that access remains on this machine.
      FIRST VIEWPORT: A compact masthead and icon theme toggle sit above a two-column access sheet with the form left and a restrained signal drawing right.
      FORM: Pinned bibo editorial-engineering system, first of seven grounded operator-world directions; seed issue-29-pinned.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <header class="access-header">
      <a class="brand" href="/access" aria-label="ASR EN VI">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M8 22v-4m6 10V12m6 18V10m6 20V14m6 16V18" />
          </svg>
        </span>
        <span class="brand-wordmark">ASR <span class="brand-separator">/</span> EN VI</span>
      </a>
      <div class="masthead-controls">
        <button class="lang-toggle" type="button" data-lang-toggle>EN</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Chuyển giao diện">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M16.25 12.15A6.65 6.65 0 0 1 7.85 3.75 6.7 6.7 0 1 0 16.25 12.15Z" />
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="3.25" />
            <path d="M10 1.75v1.5M10 16.75v1.5M18.25 10h-1.5M3.25 10h-1.5M15.83 4.17l-1.06 1.06M5.23 14.77l-1.06 1.06M15.83 15.83l-1.06-1.06M5.23 5.23 4.17 4.17" />
          </svg>
        </button>
      </div>
    </header>
    <main class="access-layout">
      <section class="access-card" aria-labelledby="access-title">
        <h1 id="access-title">Mở không gian làm việc</h1>
        <p class="intro">
          Dùng link truy cập được in trong terminal, hoặc nhập token đã được cấp.
          Token chỉ dùng để mở phiên trên trình duyệt này.
        </p>

        <form id="access-form" class="access-form" novalidate>
          <label for="access-token">Access token</label>
          <div class="token-field">
            <input
              id="access-token"
              name="token"
              type="password"
              inputmode="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Dán token tại đây"
              aria-describedby="access-help access-status"
            />
            <span class="lock-mark" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none">
                <rect x="4" y="8" width="12" height="9" rx="2" />
                <path d="M7 8V5.8a3 3 0 0 1 6 0V8m-3 4v2" />
              </svg>
            </span>
          </div>
          <p id="access-help" class="field-help">
            Link từ terminal sẽ xác thực tự động và xóa token khỏi thanh địa chỉ.
          </p>
          <button id="access-submit" type="submit">
            <span>Mở workspace</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4 10h11m-4-4 4 4-4 4" />
            </svg>
          </button>
          <p id="access-status" class="status" role="status" aria-live="polite"></p>
        </form>

        <div class="privacy-note">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Chỉ truy cập được trên máy đang chạy ứng dụng.</span>
        </div>
      </section>
      <div class="access-orbit" aria-hidden="true">
        <div class="orbit-ring orbit-ring-one"></div>
        <div class="orbit-ring orbit-ring-two"></div>
        <svg viewBox="0 0 320 112" fill="none">
          <path d="M8 57h48l15-25 20 49 22-66 24 82 23-63 20 45 16-22h106" />
          <path class="orbit-trace" d="M8 91h91m122 0h91" />
        </svg>
      </div>
    </main>
  </body>
</html>
