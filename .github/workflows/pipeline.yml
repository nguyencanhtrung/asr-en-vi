name: Pipeline

"on":
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.15"

jobs:
  quality:
    name: Quality and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install media tools
        run: |
          # Work around sustained Azure archive slowness: https://github.com/actions/runner-images/issues/14823
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install Chromium
        run: uv run --locked playwright install --with-deps chromium
      - name: Check release tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run --locked python scripts/check-release.py "${GITHUB_REF_NAME}"
      - name: Install actionlint
        run: |
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          GOBIN="${RUNNER_TEMP}/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          echo "${RUNNER_TEMP}/actionlint-bin" >> "${GITHUB_PATH}"
      - name: Run repository checks
        env:
          ASR_RUN_BROWSER_TESTS: "1"
          ASR_REQUIRE_MEDIA_TOOLS: "1"
        run: ./scripts/check.sh

  container:
    name: Build container (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: asr-en-vi:ci
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=container
      - name: Check native platform coverage
        run: |
          docker run --pull=never --rm --network none -i --entrypoint python \
            asr-en-vi:ci - < scripts/check-platform-coverage.py
      - name: Smoke-test container runtime
        run: ./scripts/container-smoke.sh asr-en-vi:ci

  release-record:
    name: Prepare public source download location
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft > "${RUNNER_TEMP}/is-draft"; then
            test "$(cat "${RUNNER_TEMP}/is-draft")" = false
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "Source release. Platform images are being verified. Corresponding-source archives are uploaded before each image is published; see the repository release notes for scope and limitations."
          fi

  publish-platform:
    name: Publish ${{ matrix.platform }} container
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-record
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build platform candidate
        id: candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: asr-release:candidate
          build-args: |
            VCS_REF=${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=container
      - name: Publish corresponding source before image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ matrix.artifact }}
          CANDIDATE_METADATA: ${{ steps.candidate.outputs.metadata }}
        run: |
          output="${RUNNER_TEMP}/release-sources"
          candidate_config_digest="$(jq -er '."containerimage.config.digest" // empty | select(test("^sha256:[0-9a-f]{64}$"))' \
            <<< "${CANDIDATE_METADATA}")"
          test -n "${candidate_config_digest}"
          python3 scripts/prepare-release-bundle.py asr-release:candidate \
            --version "${GITHUB_REF_NAME#v}" --platform "${RELEASE_PLATFORM}" \
            --config-digest "${candidate_config_digest}" --output "${output}"
          name="corresponding-source-${RELEASE_PLATFORM}-${candidate_config_digest#sha256:}.tar.gz"
          mv "${output}/corresponding-source.tar.gz" "${output}/${name}"
          (cd "${output}" && sha256sum "${name}" > "${name}.sha256")
          gh release upload "${GITHUB_REF_NAME}" "${output}/${name}" "${output}/${name}.sha256"
          # Verify public access without inheriting GitHub credentials.
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name}.sha256" \
            --output "${output}/public.sha256"
          cmp "${output}/${name}.sha256" "${output}/public.sha256"
      - name: Build and push platform image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=container
          provenance: mode=max
          sbom: true
      - name: Verify public platform image
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          CANDIDATE_METADATA: ${{ steps.candidate.outputs.metadata }}
          PUBLISHED_METADATA: ${{ steps.publish.outputs.metadata }}
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "${anonymous_config}"' EXIT
          DOCKER_CONFIG="${anonymous_config}" docker pull "${PUBLISHED_IMAGE}"
          published_config_digest="$(jq -er '."containerimage.config.digest" // empty | select(test("^sha256:[0-9a-f]{64}$"))' \
            <<< "${PUBLISHED_METADATA}")"
          candidate_config_digest="$(jq -er '."containerimage.config.digest" // empty | select(test("^sha256:[0-9a-f]{64}$"))' \
            <<< "${CANDIDATE_METADATA}")"
          test "${published_config_digest}" = "${candidate_config_digest}"
          expected_version="${GITHUB_REF_NAME#v}"
          expected_schema="$(sed -n 's/^SCHEMA_VERSION = \([0-9][0-9]*\)$/\1/p' src/asr_en_vi/storage.py)"
          test -n "${expected_schema}"
          docker run --pull=never --rm --network none --entrypoint python \
            "${PUBLISHED_IMAGE}" -m asr_en_vi.cli version --json \
            --expect-version "${expected_version}" --expect-schema "${expected_schema}"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${PUBLISHED_IMAGE}")"
          test "${revision}" = "${GITHUB_SHA}"
          ./scripts/container-smoke.sh "${PUBLISHED_IMAGE}"
      - name: Export image digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.publish.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish container manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Create and publish multi-platform manifest
        id: publish
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${IMAGE_TAGS_JSON}") \
            --metadata-file "${RUNNER_TEMP}/manifest.json" \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
          digest="$(jq -r '."containerimage.descriptor".digest' "${RUNNER_TEMP}/manifest.json")"
          test "${digest}" != "null"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Attest published container
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
