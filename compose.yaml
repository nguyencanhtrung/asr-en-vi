services:
  app:
    image: asr-en-vi:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uvicorn
      - asr_en_vi.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --no-proxy-headers
      - --no-server-header
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${ASR_PORT:-8765}:8765"
    environment:
      ASR_DATA_DIR: /var/lib/asr-en-vi/data
      ASR_AUTH_DIR: /var/lib/asr-en-vi/auth
      ASR_PUBLIC_URL: ${ASR_PUBLIC_URL:-http://127.0.0.1:${ASR_PORT:-8765}}
      ASR_COOKIE_SECURE: ${ASR_COOKIE_SECURE:-false}
      ASR_MAX_UPLOAD_BYTES: ${ASR_MAX_UPLOAD_BYTES:-4294967296}
      ASR_MAX_RECORDING_SECONDS: ${ASR_MAX_RECORDING_SECONDS:-14400}
      ASR_DIARIZATION_MODEL_PATH: ${ASR_DIARIZATION_MODEL_PATH:-/models/speaker-diarization-community-1}
    volumes:
      - data:/var/lib/asr-en-vi/data
      - auth:/var/lib/asr-en-vi/auth
      - "${ASR_MODEL_HOST_PATH:-./models}:/models:ro"
    healthcheck:
      test: ["CMD", "python", "-m", "asr_en_vi.cli", "health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    stop_grace_period: 15s

  worker:
    image: asr-en-vi:local
    command: ["python", "-m", "asr_en_vi.worker"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ASR_DATA_DIR: /var/lib/asr-en-vi/data
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      ASR_MODEL_PATH: ${ASR_MODEL_PATH:-}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-}
      ASR_GPU_MODEL_PATH: ${ASR_GPU_MODEL_PATH:-/models/whisper-large-v3}
      ASR_CPU_MODEL_PATH: ${ASR_CPU_MODEL_PATH:-/models/whisper-small}
      ASR_GPU_COMPUTE_TYPE: ${ASR_GPU_COMPUTE_TYPE:-float16}
      ASR_CPU_COMPUTE_TYPE: ${ASR_CPU_COMPUTE_TYPE:-int8}
      ASR_DIARIZATION_MODEL_PATH: ${ASR_DIARIZATION_MODEL_PATH:-/models/speaker-diarization-community-1}
    volumes:
      - data:/var/lib/asr-en-vi/data
      - "${ASR_MODEL_HOST_PATH:-./models}:/models:ro"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "asr_en_vi.worker", "--health-check"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 20s

volumes:
  data:
  auth:
