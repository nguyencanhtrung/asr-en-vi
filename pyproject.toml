[project]
name = "asr-en-vi"
version = "0.1.0"
description = "Local-first meeting notes workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=11,<19",
    "fastapi>=0.115,<1.0",
    "faster-whisper==1.2.1",
    "pyannote.audio==4.0.7",
    "qrcode>=8.0,<9.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcodec==0.11.1",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "playwright>=1.50,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-timeout>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_en_vi"]
include = [
    "src/asr_en_vi/web/*.html",
    "src/asr_en_vi/web/*.css",
    "src/asr_en_vi/web/*.js",
    "src/asr_en_vi/web/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Use @pytest.mark.timeout(0) only when an opt-in test has its own deadline.
timeout = 300
timeout_method = "thread"
markers = [
    "browser: requires Chromium and exercises the access flow in a real browser",
    "slow: opt-in processing test that can take several minutes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
