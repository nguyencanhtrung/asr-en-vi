[project]
name = "asr-en-vi"
version = "0.1.0"
description = "Local-first meeting notes workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "qrcode>=8.0,<9.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "playwright>=1.50,<2.0",
    "pytest>=8.3,<9.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_en_vi"]
include = ["src/asr_en_vi/web/*.html", "src/asr_en_vi/web/*.css", "src/asr_en_vi/web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: requires Chromium and exercises the access flow in a real browser"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
